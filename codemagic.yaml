workflows:
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.brechtdeprez.blockora
      vars:
        XCODE_PROJECT: "Blockora.xcodeproj"
        XCODE_SCHEME: "Blockora"
        BUNDLE_ID: "com.brechtdeprez.blockora"
      # shortcut: project.pbxproj was last saved by a local Xcode 27.0 and needs
      # that project file format; Codemagic's stable "latest" (26.x) can't open it
      # ("future Xcode project file format"), so pin to the edge channel which has
      # Xcode 27.0. Once 27.0 becomes Codemagic's stable default, switch to "latest".
      xcode: edge
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
